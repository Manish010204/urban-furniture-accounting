{% extends "base.html" %}
{% block title %}New Journal Entry{% endblock %}
{% block heading %}New Manual Journal Entry{% endblock %}
{% block content %}
<div class="panel" style="max-width:820px;">
  <div class="panel-body">
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/journal-entries/new">
      <div class="form-grid">
        <div class="field">
          <label>Journal *</label>
          <select name="journal_id" required>
            {% for j in journals %}<option value="{{ j.id }}">{{ j.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="field">
          <label>Date *</label>
          <input type="date" name="date" required value="{{ today }}">
        </div>
        <div class="field full">
          <label>Reference</label>
          <input type="text" name="reference" placeholder="e.g. Adjustment note">
        </div>
      </div>

      <table class="line-items-table" id="lines-table">
        <thead><tr><th style="width:50%;">Account</th><th>Debit</th><th>Credit</th><th></th></tr></thead>
        <tbody id="lines-body">
          <tr>
            <td>
              <select name="account_id">
                <option value="">Select account</option>
                {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }} ({{ a.type.value|title }})</option>{% endfor %}
              </select>
            </td>
            <td><input type="number" step="0.01" min="0" name="debit"></td>
            <td><input type="number" step="0.01" min="0" name="credit"></td>
            <td><button type="button" class="btn small" onclick="removeLine(this)">✕</button></td>
          </tr>
          <tr>
            <td>
              <select name="account_id">
                <option value="">Select account</option>
                {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }} ({{ a.type.value|title }})</option>{% endfor %}
              </select>
            </td>
            <td><input type="number" step="0.01" min="0" name="debit"></td>
            <td><input type="number" step="0.01" min="0" name="credit"></td>
            <td><button type="button" class="btn small" onclick="removeLine(this)">✕</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn small" onclick="addLine()" style="margin-top:8px;">+ Add Line</button>
      <p class="help-text">Total debit must equal total credit for the entry to post.</p>

      <div class="btn-row">
        <button class="btn primary" type="submit">Post Journal Entry</button>
        <a class="btn" href="/journal-entries">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
function addLine() {
  const body = document.getElementById('lines-body');
  const row = body.rows[0].cloneNode(true);
  row.querySelectorAll('input').forEach(i => i.value = '');
  row.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
  body.appendChild(row);
}
function removeLine(btn) {
  const body = document.getElementById('lines-body');
  if (body.rows.length > 2) btn.closest('tr').remove();
}
</script>
{% endblock %}
