{% extends "base.html" %}
{% block title %}Generate Invoice for SO-{{ so.id }}{% endblock %}
{% block heading %}Generate Customer Invoice{% endblock %}
{% block content %}
<div class="panel" style="max-width:520px;">
  <div class="panel-body">
    <p class="help-text">SO-{{ so.id }} — {{ so.customer.name }} — Grand Total ₹{{ "%.2f"|format(so.total) }}</p>
    <form method="post" action="/sales/{{ so.id }}/generate-invoice">
      <div class="field">
        <label>Invoice Date *</label>
        <input type="date" name="invoice_date" required value="{{ invoice_date }}">
      </div>
      <div class="field">
        <label>Due Date *</label>
        <input type="date" name="due_date" required value="{{ due_date }}">
      </div>
      <div class="btn-row">
        <button class="btn primary" type="submit">Generate Invoice</button>
        <a class="btn" href="/sales/{{ so.id }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
