{% extends "base.html" %}
{% block title %}New Sales Order{% endblock %}
{% block heading %}New Sales Order{% endblock %}
{% block content %}
<div class="panel" style="max-width:900px;">
  <div class="panel-body">
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/sales/new">
      <div class="form-grid">
        <div class="field">
          <label>Customer *</label>
          <select name="customer_id" required>
            <option value="">Select customer</option>
            {% for c in customers %}<option value="{{ c.id }}" {{ 'selected' if selected_customer_id==c.id }}>{{ c.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="field">
          <label>Date *</label>
          <input type="date" name="date" required value="{{ today }}">
        </div>
        <div class="field full">
          <label>Analytic Account (optional)</label>
          <select name="analytic_account_id">
            <option value="">—</option>
            {% for a in analytic_accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <table class="line-items-table" id="lines-table">
        <thead><tr><th style="width:32%;">Product</th><th>Quantity</th><th>Unit Price</th><th>Tax %</th><th>Line Total</th><th></th></tr></thead>
        <tbody id="lines-body">
          <tr>
            <td>
              <select name="product_id" class="product-select" onchange="autofillPrice(this)">
                <option value="">Select product</option>
                {% for p in products %}<option value="{{ p.id }}" data-price="{{ p.sales_price }}">{{ p.name }}</option>{% endfor %}
              </select>
            </td>
            <td><input type="number" step="0.01" min="0.01" name="qty" value="1"></td>
            <td><input type="number" step="0.01" min="0" name="unit_price"></td>
            <td><input type="number" step="0.01" min="0" name="tax_percent" value="5"></td>
            <td class="num line-total">₹0.00</td>
            <td><button type="button" class="btn small" onclick="removeLine(this)">✕</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn small" onclick="addLine()" style="margin-top:8px;">+ Add Product</button>
      <div style="text-align:right;margin-top:10px;font-size:13.5px;">
        <div>Subtotal: <strong id="subtotal">₹0.00</strong></div>
        <div>Tax: <strong id="tax-total">₹0.00</strong></div>
        <div style="font-size:15px;">Grand Total: <strong id="grand-total">₹0.00</strong></div>
      </div>

      <div class="btn-row">
        <button class="btn primary" type="submit">Save Sales Order</button>
        <a class="btn" href="/sales">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
function autofillPrice(select) {
  const price = select.selectedOptions[0] ? select.selectedOptions[0].dataset.price : '';
  const row = select.closest('tr');
  const priceInput = row.querySelector('[name=unit_price]');
  if (price && !priceInput.value) priceInput.value = price;
  recalc();
}
function recalc() {
  let subtotal = 0, tax = 0;
  document.querySelectorAll('#lines-body tr').forEach(row => {
    const qty = parseFloat(row.querySelector('[name=qty]').value) || 0;
    const price = parseFloat(row.querySelector('[name=unit_price]').value) || 0;
    const taxPct = parseFloat(row.querySelector('[name=tax_percent]').value) || 0;
    const lineSub = qty * price;
    const lineTax = lineSub * taxPct / 100;
    row.querySelector('.line-total').textContent = '₹' + (lineSub + lineTax).toFixed(2);
    subtotal += lineSub;
    tax += lineTax;
  });
  document.getElementById('subtotal').textContent = '₹' + subtotal.toFixed(2);
  document.getElementById('tax-total').textContent = '₹' + tax.toFixed(2);
  document.getElementById('grand-total').textContent = '₹' + (subtotal + tax).toFixed(2);
}
function addLine() {
  const body = document.getElementById('lines-body');
  const row = body.rows[0].cloneNode(true);
  row.querySelectorAll('input').forEach(i => { if (i.name === 'qty') i.value = 1; else if (i.name === 'tax_percent') i.value = 5; else i.value = ''; });
  row.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
  row.querySelector('.line-total').textContent = '₹0.00';
  body.appendChild(row);
  attachListeners();
}
function removeLine(btn) {
  const body = document.getElementById('lines-body');
  if (body.rows.length > 1) { btn.closest('tr').remove(); recalc(); }
}
function attachListeners() {
  document.querySelectorAll('#lines-body input').forEach(i => i.oninput = recalc);
}
attachListeners();
</script>
{% endblock %}
