{% extends "base.html" %}
{% block title %}New Budget{% endblock %}
{% block heading %}New Budget{% endblock %}
{% block content %}
<div class="panel">
  <div class="panel-body" style="max-width:640px;">
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/budgets/new">
      <div class="field">
        <label>Budget Name *</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Period Start *</label>
          <input type="date" name="period_start" required>
        </div>
        <div class="field">
          <label>Period End *</label>
          <input type="date" name="period_end" required>
        </div>
        <div class="field">
          <label>Responsible Person *</label>
          <input type="text" name="responsible_person" required>
        </div>
        <div class="field">
          <label>Planned Amount *</label>
          <input type="number" step="0.01" min="0" name="planned_amount" required>
        </div>
        <div class="field full">
          <label>Analytic Account *</label>
          <select name="analytic_account_id" required>
            {% for a in analytic_accounts %}<option value="{{ a.id }}">{{ a.name }} ({{ a.type.value|title }})</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" type="submit">Create Budget</button>
        <a class="btn" href="/budgets">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
