{% extends "base.html" %}
{% block title %}New Budget{% endblock %}
{% block heading %}New Budget{% endblock %}
{% block content %}
<div class="panel" style="max-width:760px;">
  <div class="panel-body">
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/budgets/new">
      <div class="field">
        <label>Budget Name *</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Period Start *</label>
          <input type="date" name="period_start" required>
        </div>
        <div class="field">
          <label>Period End *</label>
          <input type="date" name="period_end" required>
        </div>
        <div class="field full">
          <label>Responsible *</label>
          <select name="responsible_person" required>
            <option value="">Select from contacts</option>
            {% for c in contacts %}<option value="{{ c.name }}">{{ c.name }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <table class="line-items-table" id="lines-table">
        <thead><tr><th style="width:60%;">Analytic Account</th><th>Committed Amount</th><th></th></tr></thead>
        <tbody id="lines-body">
          <tr>
            <td>
              <select name="analytic_account_id">
                <option value="">Select analytic account</option>
                {% for a in analytic_accounts %}<option value="{{ a.id }}">{{ a.name }} ({{ a.type.value|title }})</option>{% endfor %}
              </select>
            </td>
            <td><input type="number" step="0.01" min="0" name="committed_amount"></td>
            <td><button type="button" class="btn small" onclick="removeLine(this)">✕</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn small" onclick="addLine()" style="margin-top:8px;">+ Add Analytic Line</button>

      <div class="btn-row">
        <button class="btn primary" type="submit">Create Budget</button>
        <a class="btn" href="/budgets">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
function addLine() {
  const body = document.getElementById('lines-body');
  const row = body.rows[0].cloneNode(true);
  row.querySelectorAll('input').forEach(i => i.value = '');
  row.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
  body.appendChild(row);
}
function removeLine(btn) {
  const body = document.getElementById('lines-body');
  if (body.rows.length > 1) btn.closest('tr').remove();
}
</script>
{% endblock %}
