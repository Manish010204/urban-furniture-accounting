{% extends "base.html" %}
{% block title %}New Purchase Order{% endblock %}
{% block heading %}New Purchase Order{% endblock %}
{% block content %}
<div class="panel" style="max-width:820px;">
  <div class="panel-body">
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/purchases/new">
      <div class="form-grid">
        <div class="field">
          <label>Vendor *</label>
          <select name="vendor_id" required>
            <option value="">Select vendor</option>
            {% for v in vendors %}<option value="{{ v.id }}" {{ 'selected' if selected_vendor_id==v.id }}>{{ v.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="field">
          <label>Date *</label>
          <input type="date" name="date" required value="{{ today }}">
        </div>
      </div>

      <table class="line-items-table" id="lines-table">
        <thead><tr><th style="width:28%;">Product</th><th>Budget Analytics</th><th>Quantity</th><th>Unit Price</th><th>Line Total</th><th></th></tr></thead>
        <tbody id="lines-body">
          <tr>
            <td>
              <select name="product_id" class="product-select" onchange="autofillPrice(this)">
                <option value="">Select product</option>
                {% for p in products %}<option value="{{ p.id }}" data-price="{{ p.cost_price }}">{{ p.name }}</option>{% endfor %}
              </select>
            </td>
            <td>
              <select name="analytic_account_id">
                <option value="">—</option>
                {% for a in analytic_accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
              </select>
            </td>
            <td><input type="number" step="0.01" min="0.01" name="qty" value="1"></td>
            <td><input type="number" step="0.01" min="0" name="unit_price"></td>
            <td class="num line-total">₹0.00</td>
            <td><button type="button" class="btn small" onclick="removeLine(this)">✕</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn small" onclick="addLine()" style="margin-top:8px;">+ Add Product</button>
      <p style="text-align:right;margin-top:10px;font-size:14px;">Order Total: <strong id="grand-total">₹0.00</strong></p>

      <div class="btn-row">
        <button class="btn primary" type="submit">Save Purchase Order</button>
        <a class="btn" href="/purchases">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
function autofillPrice(select) {
  const price = select.selectedOptions[0] ? select.selectedOptions[0].dataset.price : '';
  const row = select.closest('tr');
  const priceInput = row.querySelector('[name=unit_price]');
  if (price && !priceInput.value) priceInput.value = price;
  recalc();
}
function recalc() {
  let grand = 0;
  document.querySelectorAll('#lines-body tr').forEach(row => {
    const qty = parseFloat(row.querySelector('[name=qty]').value) || 0;
    const price = parseFloat(row.querySelector('[name=unit_price]').value) || 0;
    const total = qty * price;
    row.querySelector('.line-total').textContent = '₹' + total.toFixed(2);
    grand += total;
  });
  document.getElementById('grand-total').textContent = '₹' + grand.toFixed(2);
}
function addLine() {
  const body = document.getElementById('lines-body');
  const row = body.rows[0].cloneNode(true);
  row.querySelectorAll('input').forEach(i => i.value = i.name === 'qty' ? 1 : '');
  row.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
  row.querySelector('.line-total').textContent = '₹0.00';
  body.appendChild(row);
  attachListeners();
}
function removeLine(btn) {
  const body = document.getElementById('lines-body');
  if (body.rows.length > 1) { btn.closest('tr').remove(); recalc(); }
}
function attachListeners() {
  document.querySelectorAll('#lines-body input').forEach(i => i.oninput = recalc);
}
attachListeners();
</script>
{% endblock %}
