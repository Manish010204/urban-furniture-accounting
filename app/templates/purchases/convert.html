{% extends "base.html" %}
{% block title %}Convert {{ po.number }} to Vendor Bill{% endblock %}
{% block heading %}Convert to Vendor Bill{% endblock %}
{% block content %}
<div class="panel" style="max-width:520px;">
  <div class="panel-body">
    <p class="help-text">{{ po.number }} — {{ po.vendor.name }} — Total ₹{{ "%.2f"|format(po.total) }}</p>
    <form method="post" action="/purchases/{{ po.id }}/convert">
      <div class="field">
        <label>Bill Reference</label>
        <input type="text" name="reference" placeholder="e.g. vendor's own invoice number">
      </div>
      <div class="field">
        <label>Invoice Date *</label>
        <input type="date" name="invoice_date" required value="{{ invoice_date }}">
      </div>
      <div class="field">
        <label>Due Date *</label>
        <input type="date" name="due_date" required value="{{ due_date }}">
      </div>
      <div class="btn-row">
        <button class="btn primary" type="submit">Create Vendor Bill</button>
        <a class="btn" href="/purchases/{{ po.id }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
